<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SnapDex - Reset Password</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    color: #102653;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
    background:
        radial-gradient(circle at 8% 25%, rgba(70, 170, 255, .23), transparent 30%),
        radial-gradient(circle at 92% 70%, rgba(95, 205, 255, .18), transparent 32%),
        linear-gradient(135deg, #fbfdff 0%, #eaf5ff 48%, #f8fcff 100%);
}

.bg-seal {
    position: fixed;
    width: 650px;
    height: 650px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    object-fit: contain;
    opacity: .05;
    filter: blur(1.5px);
    z-index: 0;
    pointer-events: none;
}

.card {
    position: relative;
    z-index: 5;
    width: 100%;
    max-width: 480px;
    padding: 35px 37px;
    border-radius: 26px;
    background: rgba(255, 255, 255, .96);
    border: 1px solid rgba(205, 221, 239, .90);
    box-shadow:
        0 30px 75px rgba(25, 75, 125, .13),
        0 5px 20px rgba(25, 75, 125, .07);
    backdrop-filter: blur(25px);
}

.brand-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding-bottom: 20px;
    border-bottom: 1px solid #e0e8f2;
    margin-bottom: 24px;
}

.srm-logo {
    width: 120px;
    height: 50px;
    object-fit: contain;
}

.brand-title {
    font-size: 20px;
    font-weight: 800;
    color: #142a58;
}

.brand-title span {
    color: #139ce9;
}

.brand-tag {
    font-size: 8px;
    letter-spacing: 1.8px;
    font-weight: 800;
    color: #71809a;
}

h2 {
    font-size: 26px;
    color: #102143;
    margin-bottom: 6px;
}

.subtitle {
    color: #71819b;
    font-size: 13px;
    margin-bottom: 24px;
    line-height: 1.5;
}

.group {
    margin-bottom: 18px;
}

label {
    display: block;
    color: #253655;
    font-size: 11px;
    font-weight: 800;
    margin-bottom: 8px;
}

.input-wrap {
    position: relative;
}

.input-wrap input {
    width: 100%;
    height: 48px;
    padding: 0 42px;
    border: 1px solid #d6e2ef;
    border-radius: 12px;
    background: #f9fcff;
    outline: none;
    color: #1b2e50;
    font-size: 13px;
    transition: 0.2s;
}

.input-wrap input:focus {
    background: white;
    border-color: #1599eb;
    box-shadow: 0 0 0 4px rgba(21, 153, 235, .08);
}

.left-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #7286a3;
    font-size: 14px;
}

.btn {
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #17a8f2, #087de1);
    color: white;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 12px 25px rgba(8, 126, 225, .25);
    transition: .2s;
    margin-top: 10px;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 30px rgba(8, 126, 225, .30);
}

.btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
}

.back-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #0878d8;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
}

.back-link:hover {
    text-decoration: underline;
}

.msg-box {
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 12px;
    margin-bottom: 18px;
    display: none;
    line-height: 1.4;
}

.msg-box.info {
    display: block;
    background: #e8f4fd;
    color: #0b69a3;
    border: 1px solid #cbe4fb;
}

.msg-box.error {
    display: block;
    background: #fff1f2;
    color: #dc2626;
    border: 1px solid #fecdd3;
}

.msg-box.success {
    display: block;
    background: #f0fdf4;
    color: #15803d;
    border: 1px solid #bbf7d0;
}

.step-box {
    display: none;
}

.step-box.active {
    display: block;
}
</style>
</head>

<body>

<img src="srm_seal.png" class="bg-seal" alt="" aria-hidden="true">

<div class="card">

    <div class="brand-header">
        <img src="srm_logo.png" class="srm-logo" alt="SRM IST">
        <div>
            <div class="brand-title">Snap<span>Dex</span></div>
            <div class="brand-tag">SMART ATTENDANCE</div>
        </div>
    </div>

    <h2>Reset Password</h2>
    <p class="subtitle">Enter your official SRM email to receive a 6-digit verification OTP.</p>

    <div id="statusMessage" class="msg-box"></div>

    <!-- STEP 1: REQUEST OTP -->
    <div id="step1" class="step-box active">
        <form id="otpRequestForm">
            <div class="group">
                <label for="facultyEmail">Official SRM Email</label>
                <div class="input-wrap">
                    <span class="left-icon">✉</span>
                    <input
                        type="email"
                        id="facultyEmail"
                        placeholder="example@srmist.edu.in"
                        required
                        autocomplete="email"
                    >
                </div>
            </div>

            <button type="submit" id="sendOtpBtn" class="btn">
                SEND VERIFICATION OTP
            </button>
        </form>
    </div>

    <!-- STEP 2: VERIFY OTP & RESET -->
    <div id="step2" class="step-box">
        <form id="passwordResetForm">
            <div class="group">
                <label for="otpInput">6-Digit OTP</label>
                <div class="input-wrap">
                    <span class="left-icon">🔢</span>
                    <input
                        type="text"
                        id="otpInput"
                        placeholder="Enter 6-digit code"
                        maxlength="6"
                        required
                    >
                </div>
            </div>

            <div class="group">
                <label for="newPassword">New Password (Min 8 Characters)</label>
                <div class="input-wrap">
                    <span class="left-icon">🔒</span>
                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Create strong new password"
                        minlength="8"
                        required
                    >
                </div>
            </div>

            <div class="group">
                <label for="confirmNewPassword">Confirm New Password</label>
                <div class="input-wrap">
                    <span class="left-icon">🔒</span>
                    <input
                        type="password"
                        id="confirmNewPassword"
                        placeholder="Re-enter new password"
                        minlength="8"
                        required
                    >
                </div>
            </div>

            <button type="submit" id="resetPasswordBtn" class="btn">
                RESET PASSWORD
            </button>
        </form>
    </div>

    <a href="index.html" class="back-link">← Back to Login</a>

</div>

<script>
const API_BASE_URL = "http://localhost:8080";

let verifiedEmail = "";

function showStatus(text, type) {
    const box = document.getElementById("statusMessage");
    box.className = "msg-box " + type;
    box.textContent = text;
}

// Handle Step 1: Send OTP
document.getElementById("otpRequestForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const email = document.getElementById("facultyEmail").value.trim().toLowerCase();
    const btn = document.getElementById("sendOtpBtn");

    if (!email.endsWith("@srmist.edu.in")) {
        showStatus("Please use your official SRM email address ending with @srmist.edu.in", "error");
        return;
    }

    btn.disabled = true;
    btn.textContent = "SENDING OTP...";

    try {
        const response = await fetch(`${API_BASE_URL}/api/faculty/forgot-password`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: email })
        });

        const text = await response.text();

        if (!response.ok) {
            throw new Error(text || "Failed to generate OTP.");
        }

        verifiedEmail = email;
        showStatus("✓ OTP generated! In development mode, please check the backend console.", "info");

        document.getElementById("step1").classList.remove("active");
        document.getElementById("step2").classList.add("active");

    } catch (err) {
        showStatus(err.message || "Failed to send OTP.", "error");
    } finally {
        btn.disabled = false;
        btn.textContent = "SEND VERIFICATION OTP";
    }
});

// Handle Step 2: Reset Password
document.getElementById("passwordResetForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const otp = document.getElementById("otpInput").value.trim();
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmNewPassword").value;
    const btn = document.getElementById("resetPasswordBtn");

    if (newPassword !== confirmPassword) {
        showStatus("Passwords do not match.", "error");
        return;
    }

    if (newPassword.length < 8) {
        showStatus("Password must be at least 8 characters long.", "error");
        return;
    }

    btn.disabled = true;
    btn.textContent = "RESETTING PASSWORD...";

    try {
        const response = await fetch(`${API_BASE_URL}/api/faculty/reset-password`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                email: verifiedEmail,
                otp: otp,
                newPassword: newPassword
            })
        });

        const text = await response.text();

        if (!response.ok) {
            throw new Error(text || "Failed to reset password.");
        }

        showStatus("✓ Password reset successfully! Redirecting to login...", "success");

        setTimeout(() => {
            window.location.href = "index.html";
        }, 1500);

    } catch (err) {
        showStatus(err.message || "Failed to reset password.", "error");
        btn.disabled = false;
        btn.textContent = "RESET PASSWORD";
    }
});
</script>

</body>
</html>
